databases:
  - name: okc-db
    databaseName: okc
    user: okcapplicant
    plan: free

services:
  - type: web
    name: okc-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && PYTHONPATH=. python scripts/ingest_raw_data.py && gunicorn app.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings

  - type: web
    name: okc-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm run deploy"
    envVars:
      - key: NODE_VERSION
        value: "22"
